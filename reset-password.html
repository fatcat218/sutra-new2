<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset your password — Sutra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=ui-review-20260702-final">
</head>
<body class="chatbot-page">

<canvas id="ring-grid" aria-hidden="true"></canvas>

<nav>
  <div class="wrap inner">
    <a class="logo" href="index.html"><span>Sutra</span><span class="dot"></span></a>
    <a class="auth-back-link" href="chatbot.html">Back to login</a>
  </div>
</nav>

<main class="auth-page-main">
  <section class="auth-page-card password-reset-card"
           aria-labelledby="reset-password-title">
    <div class="section-label">Account recovery</div>
    <h1 id="reset-password-title">Choose a new <em>password.</em></h1>
    <p class="auth-page-intro" id="reset-password-intro">
      Checking your secure recovery link…
    </p>

    <p class="password-reset-loading" id="reset-password-loading">
      Preparing password reset
    </p>

    <form class="account-form" id="reset-password-form" hidden>
      <label class="field">
        <span>New password</span>
        <input id="reset-password-new" type="password"
               autocomplete="new-password" minlength="8" required
               placeholder="At least 8 characters">
      </label>
      <label class="field">
        <span>Confirm new password</span>
        <input id="reset-password-confirm" type="password"
               autocomplete="new-password" minlength="8" required
               placeholder="Enter it again">
      </label>
      <button class="btn btn-block" id="reset-password-submit" type="submit">
        Update password
      </button>
    </form>

    <p class="auth-page-error" id="reset-password-error" hidden></p>
    <p class="auth-page-success" id="reset-password-success" hidden></p>

    <div class="password-reset-actions" id="reset-password-actions" hidden>
      <a class="btn ghost" href="chatbot.html">Continue to Sutra</a>
    </div>
  </section>
</main>

<script src="main.js?v=ui-review-20260702-final" defer></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="supabase-config.js?v=supabase-20260627" defer></script>
<script src="supabase-client.js?v=auth-flow-20260627" defer></script>
<script src="reset-password.js?v=ui-review-20260702-final" defer></script>
</body>
</html>
